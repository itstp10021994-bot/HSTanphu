<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Khám Phá Nghề{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-mark">◆</span> Khám Phá Nghề
  </a>
  <nav class="topnav">
    <a href="{{ url_for('result') }}">Hồ sơ năng lực</a>
  </nav>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>Bản thử nghiệm — dữ liệu chỉ lưu trên trình duyệt của bạn.</span>
  <a href="{{ url_for('reset') }}" class="reset-link">Làm lại từ đầu</a>
</footer>
</body>
</html>

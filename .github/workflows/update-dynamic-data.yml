name: Kiểm tra định kỳ dữ liệu động (lương, lộ trình học, xu hướng AI)

# Tự động chạy 02:00 UTC (~9h sáng giờ VN) mỗi thứ Hai hàng tuần.
# Có thể bấm chạy tay bất cứ lúc nào qua tab Actions > chọn workflow này >
# "Run workflow".
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-dynamic-data:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: pip install -r scripts/requirements.txt

      - name: Chạy kiểm tra (market_data, study_data, automation_data)
        run: python scripts/update_dynamic_data.py

      - name: Commit thay đổi nếu có
        run: |
          git config user.name "career-sim-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet market_data.json study_data.json automation_data.json; then
            git add market_data.json study_data.json automation_data.json
            git commit -m "chore: cập nhật tự động dữ liệu động (kiểm tra định kỳ hàng tuần)"
            git push
          else
            echo "Không có thay đổi, bỏ qua commit."
          fi

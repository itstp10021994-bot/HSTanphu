<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Khám Phá Nghề{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<!--
  Import map: cho trình duyệt biết "three" (và "three/addons/...") nghĩa là
  file nào trên CDN. Bắt buộc phải có vì các file phụ trợ của Three.js
  (như GLTFLoader.js) tự import "three" bên trong bằng tên ngắn này.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-mark">◆</span> Khám Phá Nghề
  </a>
  <nav class="topnav">
    <a href="{{ url_for('result') }}">Hồ sơ năng lực</a>
  </nav>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>Bản thử nghiệm — dữ liệu chỉ lưu trên trình duyệt của bạn.</span>
  <a href="{{ url_for('reset') }}" class="reset-link">Làm lại từ đầu</a>
</footer>
</body>
</html>

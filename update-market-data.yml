name: Kiểm tra định kỳ dữ liệu thị trường lương

# Tự động chạy vào 02:00 UTC ngày 1 mỗi tháng (~9h sáng giờ VN).
# Có thể bấm chạy tay bất cứ lúc nào qua tab Actions > chọn workflow này >
# "Run workflow".
on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: pip install -r scripts/requirements.txt

      - name: Chạy kiểm tra
        run: python scripts/update_market_data.py

      - name: Commit thay đổi nếu có
        run: |
          git config user.name "career-sim-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet market_data.json; then
            git add market_data.json
            git commit -m "chore: cập nhật tự động market_data.json (kiểm tra định kỳ)"
            git push
          else
            echo "Không có thay đổi, bỏ qua commit."
          fi
